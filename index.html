<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Interactive anatomy study atlas with clickable bones and joints.">
  <title>Anatomy Study Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="appbar">
  <div>
    <div class="brand">ANATOMY <span>STUDY LAB</span></div>
    <div class="subtitle">Interactive skeletal anatomy atlas</div>
  </div>
  <div class="header-actions">
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="app">
  <section class="toolbar">
    <div class="seg">
      <button data-view="front" class="active">Front</button>
      <button data-view="back">Back</button>
      <button data-view="left">Left</button>
      <button data-view="right">Right</button>
    </div>
    <label class="search-wrap">
      <span>⌕</span>
      <input id="search" type="search" placeholder="Search bone, joint, landmark, or alternate name…">
    </label>
    <button id="quizOpen" class="primary">Quiz</button>
  </section>

  <section class="atlas-grid">
    <article class="viewer panel">
      <div class="viewer-head">
        <div><strong id="viewName">Anterior</strong><small>Tap a structure to study it</small></div>
        <div class="zoom-controls"><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">+</button></div>
      </div>
      <div id="searchResults" class="results"></div>
      <div class="svg-wrap" id="svgWrap"></div>
    </article>

    <aside class="details panel" id="details" aria-live="polite"></aside>
  </section>

  <section class="study-strip">
    <button data-mode="flashcards">Flashcards</button>
    <button data-mode="random">Random structure</button>
    <button data-mode="regions">Body regions</button>
    <button data-mode="progress">My progress</button>
  </section>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
